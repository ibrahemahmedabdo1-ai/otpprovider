<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأكيد البريد الإلكتروني</title></head><body><main><h1>تأكيد البريد الإلكتروني</h1><p id="status">جارٍ التأكيد...</p></main><script>const token=new URLSearchParams(location.search).get('token');fetch('/api/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).then(r=>r.json()).then(d=>document.getElementById('status').textContent=d.message||d.error||'انتهى الطلب').catch(()=>document.getElementById('status').textContent='حدث خطأ في الاتصال');</script></body></html>
